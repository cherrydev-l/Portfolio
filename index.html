<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cherry.dev — Design meets code</title>
<meta name="description" content="Cherry.dev is a personal creative space for digital experiments, thoughtful interfaces, and ideas built with character.">
<style>
:root{
  --black:#000;--graphite:#0e0e0e;--carbon:#1d1d1f;--steel:#333336;--porcelain:#f5f5f7;--ash:#86868b;--blue:#2997ff;--cherry:#ff476f;
  --font:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:26px;--pad:clamp(20px,5vw,56px);--max:1180px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0}
::selection{background:var(--cherry);color:#fff}
::-moz-selection{background:var(--cherry);color:#fff}
html{scroll-behavior:smooth;scroll-padding-top:72px;background:#000;color-scheme:dark}
body{background:var(--black);color:var(--porcelain);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
.skip{position:absolute;left:-999px;top:8px;background:var(--porcelain);color:#000;padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(14,14,14,.82);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--steel)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:52px}
.brand{font-weight:600;letter-spacing:-.02em;font-size:17px}
.brand i{color:var(--cherry);font-style:normal}
.links{display:flex;gap:28px;font-size:13px;color:var(--ash)}
.links a{transition:color .2s}.links a:hover{color:var(--porcelain)}
.burger{display:none;background:none;border:0;color:var(--porcelain);font:inherit;font-size:13px;cursor:pointer;padding:8px}
@media(max-width:700px){
  .burger{display:block}
  .links{display:none;position:absolute;top:52px;left:0;right:0;flex-direction:column;gap:0;background:var(--graphite);border-bottom:1px solid var(--steel);padding:8px var(--pad) 16px}
  .links.open{display:flex}
  .links a{padding:14px 0;font-size:17px;color:var(--porcelain);border-bottom:1px solid var(--carbon)}
}

/* hero */
.hero{min-height:calc(100svh - 52px);display:flex;align-items:center;padding:96px 0 72px;position:relative;isolation:isolate;overflow:hidden}
.hero>.wrap{position:relative;z-index:1}
.bh{position:absolute;inset:0;z-index:0;overflow:hidden;background:#000}
.bh canvas{position:absolute;inset:0;width:100%;height:100%}
@media(max-width:767px){.hero{align-items:flex-start;padding:56px 0 72px;min-height:92svh}}
.soc{color:var(--porcelain)}.soc svg{height:1em;width:1em;display:block}
.logoloop__item:hover .soc{color:var(--cherry)}
h1{font-size:clamp(3.2rem,11.5vw,9.5rem);line-height:.95;letter-spacing:-.045em;font-weight:700;max-width:12ch}
h1 .dot{color:var(--cherry)}
.lede{margin-top:36px;max-width:34em;font-size:clamp(1.1rem,2.2vw,1.45rem);color:var(--ash);line-height:1.4;letter-spacing:-.01em}
.actions{margin-top:40px;display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;min-height:46px;padding:0 24px;border-radius:980px;font-size:15px;font-weight:500;transition:background .25s,border-color .25s,color .25s;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--porcelain);color:#000;border:1px solid var(--porcelain)}
.btn.primary:hover{background:#fff}
.btn.ghost{border:1px solid var(--steel);color:var(--porcelain);background:transparent}
.btn.ghost:hover{border-color:var(--ash)}
.rise{opacity:0;transform:translateY(22px);animation:rise .9s var(--ease) forwards}
.rise.d1{animation-delay:.12s}.rise.d2{animation-delay:.24s}.rise.d3{animation-delay:.36s}
@keyframes rise{to{opacity:1;transform:none}}

/* sections */
section{padding:clamp(88px,14vw,168px) 0}
.alt{background:var(--carbon)}
h2{font-size:clamp(2.2rem,6vw,4.5rem);letter-spacing:-.035em;line-height:1.02;font-weight:700}
.about{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(40px,8vw,120px);align-items:start}
.about .body p{font-size:clamp(1.05rem,1.6vw,1.25rem);color:var(--ash);line-height:1.6;margin-bottom:1.4em;max-width:36em}
.about .body p:first-child{color:var(--porcelain);font-size:clamp(1.3rem,2.4vw,1.8rem);line-height:1.3;letter-spacing:-.02em}
.about .body p.sign{color:var(--porcelain);margin:2.6em 0 0;padding-top:1.4em;border-top:1px solid var(--steel);font-weight:600;letter-spacing:-.01em}
@media(max-width:860px){.about{grid-template-columns:1fr}}

/* projects */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:56px}
.head p{color:var(--ash);max-width:26em}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.proj{display:flex;flex-direction:column;gap:20px}
.proj.big{grid-column:span 12}
.proj.small{grid-column:span 6}
@media(max-width:760px){.proj.small{grid-column:span 12}}
.frame{position:relative;border-radius:var(--r);border:1px solid var(--steel);background:var(--black);overflow:hidden;display:grid;place-items:center;aspect-ratio:16/8;color:var(--ash);font-size:14px;transition:border-color .4s}
.small .frame{aspect-ratio:4/3}
.frame img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.frame .ph{text-align:center;padding:24px;display:grid;gap:10px;justify-items:center}
.frame .ph b{font-size:clamp(1.4rem,3vw,2.4rem);font-weight:600;color:var(--steel);letter-spacing:-.03em}
.frame::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(255,255,255,.025) 14px 15px)}
.proj:hover .frame{border-color:var(--ash)}
.proj:hover .frame img{transform:scale(1.03)}
.proj h3{font-size:clamp(1.4rem,2.4vw,2rem);letter-spacing:-.025em;font-weight:600}
.proj p{color:var(--ash);max-width:38em}
.tags{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0}
.tags li{font-size:12px;color:var(--ash);border:1px solid var(--steel);border-radius:980px;padding:3px 12px}
.plinks{display:flex;gap:22px;font-size:15px}
.plinks a{color:var(--blue)}.plinks a:hover{text-decoration:underline}
.badge{position:absolute;top:16px;left:16px;z-index:1;font-size:12px;color:var(--cherry);border:1px solid var(--steel);background:var(--graphite);border-radius:980px;padding:3px 12px}

/* tech */
.tech{text-align:center;padding:clamp(72px,10vw,120px) 0;border-top:1px solid var(--carbon)}
.tech h2{font-size:clamp(1.6rem,3.4vw,2.6rem);margin-bottom:12px}
.tech p.sub{color:var(--ash);margin-bottom:56px}
.tech .logoloop{color:var(--ash)}
.mark{font-family:var(--mono);font-size:.5em;font-weight:600;letter-spacing:-.02em;border:1.5px solid currentColor;border-radius:8px;padding:.35em .7em;white-space:nowrap;line-height:1.1;display:inline-block}
.logoloop__item:hover .mark{color:var(--porcelain)}

/* contact */
.contact{position:relative;isolation:isolate;overflow:hidden;background:#000}
.contact>.wrap{position:relative;z-index:1}
.dtbg{position:absolute;inset:0;z-index:0;pointer-events:none}
.dither-container{position:relative;width:100%;height:100%;overflow:hidden}
.dither-canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
.contact h2{max-width:14ch}
.mail{display:inline-block;margin-top:32px;font-size:clamp(1rem,2vw,1.2rem);letter-spacing:-.01em;font-weight:500;color:#fff;word-break:break-all;border-bottom:1px solid rgba(255,255,255,.35);transition:border-color .25s}
.mail:hover{border-color:var(--cherry)}
.contact .row{margin-top:28px;display:flex;gap:16px;align-items:center;color:var(--ash);font-size:14px;flex-wrap:wrap}
.copy{background:none;border:1px solid var(--steel);color:var(--porcelain);border-radius:980px;padding:8px 18px;font:inherit;font-size:14px;cursor:pointer;transition:border-color .2s}
.copy:hover{border-color:var(--ash)}

/* footer */
footer{border-top:1px solid var(--steel);padding:32px 0;font-size:13px;color:var(--ash);background:var(--black)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px 28px}
footer nav{display:flex;gap:24px}
footer a:hover{color:var(--porcelain)}

/* privacy */
.priv{padding:clamp(64px,10vw,120px) 0 clamp(80px,12vw,140px);min-height:70svh}
.priv h1{font-size:clamp(2.6rem,8vw,5.5rem);max-width:none;margin-bottom:48px}
.priv .doc{max-width:40em}
.priv p{color:var(--ash);font-size:1.1rem;line-height:1.65;margin-bottom:1.3em}
.priv p strong{color:var(--porcelain);font-weight:600}
.priv a{color:var(--cherry)}
.back{display:inline-block;margin-bottom:40px;color:var(--cherry);font-size:14px}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rise{animation:none;opacity:1;transform:none}
  *{transition-duration:.01ms!important}
}

.abouts{position:relative;isolation:isolate;overflow:hidden;background:#000}
.abouts>.wrap{position:relative;z-index:1}
.ffbg{position:absolute;inset:0;z-index:0;pointer-events:none}
.ferrofluid-container{position:relative;width:100%;height:100%;overflow:hidden}
.ferrofluid-canvas{position:absolute;inset:0;display:block;width:100%;height:100%}

/* LogoLoop.css (React Bits) */
.logoloop{position:relative;--logoloop-gap:32px;--logoloop-logoHeight:28px;--logoloop-fadeColorAuto:#fff}
.logoloop--vertical{height:100%;display:inline-block}
.logoloop--scale-hover{padding-top:calc(var(--logoloop-logoHeight)*.1);padding-bottom:calc(var(--logoloop-logoHeight)*.1)}
.logoloop__track{display:flex;width:max-content;will-change:transform;user-select:none;position:relative;z-index:0}
.logoloop--vertical .logoloop__track{flex-direction:column;height:max-content;width:100%}
.logoloop__list{display:flex;align-items:center;padding:0;list-style:none}
.logoloop--vertical .logoloop__list{flex-direction:column}
.logoloop__item{flex:0 0 auto;margin-right:var(--logoloop-gap);font-size:var(--logoloop-logoHeight);line-height:1}
.logoloop--vertical .logoloop__item{margin-right:0;margin-bottom:var(--logoloop-gap)}
.logoloop__node{display:inline-flex;align-items:center}
.logoloop__item img{height:var(--logoloop-logoHeight);width:auto;display:block;object-fit:contain;pointer-events:none;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.logoloop--scale-hover .logoloop__item{overflow:visible}
.logoloop--scale-hover .logoloop__item:hover img,.logoloop--scale-hover .logoloop__item:hover .logoloop__node{transform:scale(1.2);transform-origin:center}
.logoloop--scale-hover .logoloop__node{transition:transform .3s cubic-bezier(.4,0,.2,1)}
.logoloop__link{display:inline-flex;align-items:center;border-radius:4px;transition:opacity .2s}
.logoloop__link:hover{opacity:.8}
.logoloop--fade::before,.logoloop--fade::after{content:'';position:absolute;top:0;bottom:0;width:clamp(24px,8%,120px);pointer-events:none;z-index:10}
.logoloop--fade::before{left:0;background:linear-gradient(to right,var(--logoloop-fadeColor,var(--logoloop-fadeColorAuto)) 0%,rgba(0,0,0,0) 100%)}
.logoloop--fade::after{right:0;background:linear-gradient(to left,var(--logoloop-fadeColor,var(--logoloop-fadeColorAuto)) 0%,rgba(0,0,0,0) 100%)}
@media(prefers-reduced-motion:reduce){.logoloop__track{transform:translate3d(0,0,0)!important}.logoloop__item img,.logoloop__node{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel">
const { useCallback, useEffect, useMemo, useRef, useState, memo } = React;

/* ---------- LogoLoop (React Bits, JS + CSS) ---------- */
const ANIMATION_CONFIG = { SMOOTH_TAU: 0.25, MIN_COPIES: 2, COPY_HEADROOM: 2 };
const toCssLength = v => (typeof v === 'number' ? `${v}px` : (v ?? undefined));
const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const useResizeObserver = (callback, elements, dependencies) => {
  useEffect(() => {
    if (!window.ResizeObserver) {
      const h = () => callback();
      window.addEventListener('resize', h); callback();
      return () => window.removeEventListener('resize', h);
    }
    const observers = elements.map(ref => {
      if (!ref.current) return null;
      const o = new ResizeObserver(callback); o.observe(ref.current); return o;
    });
    callback();
    return () => observers.forEach(o => o?.disconnect());
  }, [callback, elements, dependencies]);
};

const useImageLoader = (seqRef, onLoad, dependencies) => {
  useEffect(() => {
    const images = seqRef.current?.querySelectorAll('img') ?? [];
    if (images.length === 0) { onLoad(); return; }
    let remaining = images.length;
    const done = () => { remaining -= 1; if (remaining === 0) onLoad(); };
    images.forEach(img => {
      if (img.complete) done();
      else { img.addEventListener('load', done, { once: true }); img.addEventListener('error', done, { once: true }); }
    });
    return () => images.forEach(img => { img.removeEventListener('load', done); img.removeEventListener('error', done); });
  }, [onLoad, seqRef, dependencies]);
};

const useAnimationLoop = (trackRef, targetVelocity, seqWidth, seqHeight, isHovered, hoverSpeed, isVertical) => {
  const rafRef = useRef(null), lastRef = useRef(null), offsetRef = useRef(0), velRef = useRef(0);
  useEffect(() => {
    const track = trackRef.current;
    if (!track || reduceMotion()) return;
    const seqSize = isVertical ? seqHeight : seqWidth;
    const apply = () => {
      track.style.transform = isVertical
        ? `translate3d(0, ${-offsetRef.current}px, 0)` : `translate3d(${-offsetRef.current}px, 0, 0)`;
    };
    if (seqSize > 0) { offsetRef.current = ((offsetRef.current % seqSize) + seqSize) % seqSize; apply(); }
    const animate = ts => {
      if (lastRef.current === null) lastRef.current = ts;
      const dt = Math.max(0, ts - lastRef.current) / 1000;
      lastRef.current = ts;
      const target = isHovered && hoverSpeed !== undefined ? hoverSpeed : targetVelocity;
      velRef.current += (target - velRef.current) * (1 - Math.exp(-dt / ANIMATION_CONFIG.SMOOTH_TAU));
      if (seqSize > 0) {
        offsetRef.current = (((offsetRef.current + velRef.current * dt) % seqSize) + seqSize) % seqSize;
        apply();
      }
      rafRef.current = requestAnimationFrame(animate);
    };
    rafRef.current = requestAnimationFrame(animate);
    return () => { if (rafRef.current !== null) cancelAnimationFrame(rafRef.current); rafRef.current = null; lastRef.current = null; };
  }, [targetVelocity, seqWidth, seqHeight, isHovered, hoverSpeed, isVertical, trackRef]);
};

const LogoLoop = memo(({ logos, speed = 120, direction = 'left', width = '100%', logoHeight = 28, gap = 32,
  pauseOnHover, hoverSpeed, fadeOut = false, fadeOutColor, scaleOnHover = false, renderItem,
  ariaLabel = 'Partner logos', className, style }) => {
  const containerRef = useRef(null), trackRef = useRef(null), seqRef = useRef(null);
  const [seqWidth, setSeqWidth] = useState(0);
  const [seqHeight, setSeqHeight] = useState(0);
  const [copyCount, setCopyCount] = useState(ANIMATION_CONFIG.MIN_COPIES);
  const [isHovered, setIsHovered] = useState(false);

  const effectiveHoverSpeed = useMemo(() => {
    if (hoverSpeed !== undefined) return hoverSpeed;
    if (pauseOnHover === true) return 0;
    if (pauseOnHover === false) return undefined;
    return 0;
  }, [hoverSpeed, pauseOnHover]);
  const isVertical = direction === 'up' || direction === 'down';
  const targetVelocity = useMemo(() => {
    const m = Math.abs(speed);
    const d = isVertical ? (direction === 'up' ? 1 : -1) : (direction === 'left' ? 1 : -1);
    return m * d * (speed < 0 ? -1 : 1);
  }, [speed, direction, isVertical]);

  const updateDimensions = useCallback(() => {
    const cw = containerRef.current?.clientWidth ?? 0;
    const rect = seqRef.current?.getBoundingClientRect?.();
    const sw = rect?.width ?? 0, sh = rect?.height ?? 0;
    if (isVertical) {
      const ph = containerRef.current?.parentElement?.clientHeight ?? 0;
      if (containerRef.current && ph > 0) {
        const t = Math.ceil(ph);
        if (containerRef.current.style.height !== `${t}px`) containerRef.current.style.height = `${t}px`;
      }
      if (sh > 0) {
        setSeqHeight(Math.ceil(sh));
        const vp = containerRef.current?.clientHeight ?? ph ?? sh;
        setCopyCount(Math.max(ANIMATION_CONFIG.MIN_COPIES, Math.ceil(vp / sh) + ANIMATION_CONFIG.COPY_HEADROOM));
      }
    } else if (sw > 0) {
      setSeqWidth(Math.ceil(sw));
      setCopyCount(Math.max(ANIMATION_CONFIG.MIN_COPIES, Math.ceil(cw / sw) + ANIMATION_CONFIG.COPY_HEADROOM));
    }
  }, [isVertical]);

  useResizeObserver(updateDimensions, [containerRef, seqRef], [logos, gap, logoHeight, isVertical]);
  useImageLoader(seqRef, updateDimensions, [logos, gap, logoHeight, isVertical]);
  useAnimationLoop(trackRef, targetVelocity, seqWidth, seqHeight, isHovered, effectiveHoverSpeed, isVertical);

  const cssVariables = useMemo(() => ({
    '--logoloop-gap': `${gap}px`, '--logoloop-logoHeight': `${logoHeight}px`,
    ...(fadeOutColor && { '--logoloop-fadeColor': fadeOutColor })
  }), [gap, logoHeight, fadeOutColor]);

  const rootClassName = useMemo(() => ['logoloop', isVertical ? 'logoloop--vertical' : 'logoloop--horizontal',
    fadeOut && 'logoloop--fade', scaleOnHover && 'logoloop--scale-hover', className].filter(Boolean).join(' '),
    [isVertical, fadeOut, scaleOnHover, className]);

  const onEnter = useCallback(() => { if (effectiveHoverSpeed !== undefined) setIsHovered(true); }, [effectiveHoverSpeed]);
  const onLeave = useCallback(() => { if (effectiveHoverSpeed !== undefined) setIsHovered(false); }, [effectiveHoverSpeed]);

  const renderLogoItem = useCallback((item, key) => {
    if (renderItem) return <li className="logoloop__item" key={key} role="listitem">{renderItem(item, key)}</li>;
    const isNode = 'node' in item;
    const content = isNode
      ? <span className="logoloop__node" aria-hidden={!!item.href && !item.ariaLabel}>{item.node}</span>
      : <img src={item.src} srcSet={item.srcSet} sizes={item.sizes} width={item.width} height={item.height}
          alt={item.alt ?? ''} title={item.title} loading="lazy" decoding="async" draggable={false} />;
    const label = isNode ? (item.ariaLabel ?? item.title) : (item.alt ?? item.title);
    const inner = item.href
      ? <a className="logoloop__link" href={item.href} aria-label={label || 'logo link'} target="_blank" rel="noreferrer noopener">{content}</a>
      : content;
    return <li className="logoloop__item" key={key} role="listitem" title={isNode ? item.title : undefined}>{inner}</li>;
  }, [renderItem]);

  const logoLists = useMemo(() => Array.from({ length: copyCount }, (_, ci) => (
    <ul className="logoloop__list" key={`copy-${ci}`} role="list" aria-hidden={ci > 0} ref={ci === 0 ? seqRef : undefined}>
      {logos.map((item, ii) => renderLogoItem(item, `${ci}-${ii}`))}
    </ul>
  )), [copyCount, logos, renderLogoItem]);

  const containerStyle = useMemo(() => ({
    width: isVertical ? (toCssLength(width) === '100%' ? undefined : toCssLength(width)) : (toCssLength(width) ?? '100%'),
    ...cssVariables, ...style
  }), [width, cssVariables, style, isVertical]);

  return (
    <div ref={containerRef} className={rootClassName} style={containerStyle} role="region" aria-label={ariaLabel}>
      <div className="logoloop__track" ref={trackRef} onMouseEnter={onEnter} onMouseLeave={onLeave}>{logoLists}</div>
    </div>
  );
});

/* ---------- Black hole background (ported from the supplied TSX) ---------- */
const VERT = `attribute vec2 aPos;varying vec2 vUv;void main(){vUv=aPos*0.5+0.5;gl_Position=vec4(aPos,0.0,1.0);}`;
const SCENE_FRAG = `precision highp float;
#define MAX_STEPS 460
#define WIND_CYCLE 46.0
varying vec2 vUv;
uniform vec2 uRes;uniform float uTime;uniform vec3 uCamPos;uniform vec3 uRight;uniform vec3 uUp;uniform vec3 uFwd;uniform float uTanHalf;uniform vec2 uFocus;uniform float uSteps;uniform float uSkyR;uniform float uDiskIn;uniform float uDiskOut;uniform float uThick;uniform float uDensity;uniform float uSpin;uniform float uGrain;uniform float uBright;uniform float uDoppler;uniform vec3 uHot;uniform vec3 uMid;uniform vec3 uCool;uniform float uStars;uniform float uEncode;uniform vec2 uJitter;uniform float uSeed;
float hash13(vec3 p){p=fract(p*0.3183099+vec3(0.1,0.2,0.3));p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vnoise(vec3 x){vec3 i=floor(x);vec3 f=fract(x);f=f*f*(3.0-2.0*f);

    }

    function tick(now) {

      if (!visible) { lastFrame = now; return; }

  }, []);

  return <div ref={hostRef} className="bh" aria-hidden="true"><canvas ref={canvasRef} /></div>;
}

function useNarrow(query = '(max-width: 767px)') {
  const [narrow, setNarrow] = useState(false);
  useEffect(() => {
    const m = window.matchMedia(query);
    const sync = () => setNarrow(m.matches);
    sync(); m.addEventListener('change', sync);
    return () => m.removeEventListener('change', sync);
  }, [query]);
  return narrow;
}

    waveSpeed, waveFrequency, waveAmplitude, waveColor, backgroundColor, colorNum: Math.max(2, colorNum),
    pixelSize: Math.max(1, pixelSize), disableAnimation, enableMouseInteraction, mouseRadius: Math.max(0.001, mouseRadius),
    mode: DT_MODES[ditherMode] ?? 0, palette: Array.isArray(palette) ? palette.filter(Boolean).slice(0, DT_PALETTE) : [],
    scale: Math.max(0.05, scale), contrast, brightness, effect: DT_EFFECTS[mouseEffect] ?? 0,
    mouseStrength: Math.max(0, mouseStrength), trail: dClamp(trail, 0, 1), clickRipple, intro, dpr
  };
  const settingsRef = useRef(settings);
  settingsRef.current = settings;

  useEffect(() => {
    const container = containerRef.current, canvas = canvasRef.current;
    const gl = canvas && canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false });
    if (!container || !canvas || !gl) return undefined;
    const wave = dLink(gl, DT_WAVE), dither = dLink(gl, DT_DITHER);
    if (!wave || !dither) return undefined;

    const buffer = gl.createBuffer(), vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    const field = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, field);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const framebuffer = gl.createFramebuffer();

    const probe = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
    const reduce = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
    const cache = new Map();
    const toColor = value => {
      if (Array.isArray(value)) return [0, 1, 2].map(i => dClamp(Number(value[i]) || 0, 0, 1));
      const key = String(value);
      if (cache.has(key)) return cache.get(key);
      let rgb = [0, 0, 0];
      if (probe) {
        probe.clearRect(0, 0, 1, 1); probe.fillStyle = '#000000'; probe.fillStyle = key; probe.fillRect(0, 0, 1, 1);
        const [r, g, b] = probe.getImageData(0, 0, 1, 1).data;
        rgb = [r, g, b].map(ch => dToLinear(ch / 255));
      }
      cache.set(key, rgb);
      return rgb;
    };

    const view = { width: 1, height: 1, ratio: 1, cell: 1, cellCss: 1, cols: 1, rows: 1 };
    const pointer = { x: 0, y: 0, inside: false, set: false };
    const trailPoints = [], ripples = [];
    const trailData = new Float32Array(DT_TRAIL * 3), rippleData = new Float32Array(DT_RIPPLES * 4), paletteData = new Float32Array(DT_PALETTE * 3);
    const state = { time: 0, hx: 0, hy: 0, presence: 0, reveal: settingsRef.current.intro && !reduce ? 0 : 1 };
    let raf = 0, last = 0, visible = true;

    const allocate = () => {
      const s = settingsRef.current;
      view.cell = Math.max(1, Math.round(s.pixelSize * view.ratio));
      view.cellCss = view.cell / view.ratio;
      view.cols = Math.max(1, Math.ceil(canvas.width / view.cell));
      view.rows = Math.max(1, Math.ceil(canvas.height / view.cell));
      gl.bindTexture(gl.TEXTURE_2D, field);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, view.cols, view.rows, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, field, 0);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    };
    const toUv = (x, y) => { const aspect = view.width / view.height; return [(x / view.width - 0.5) * aspect, -(y / view.height - 0.5)]; };

    const render = () => {
      const s = settingsRef.current;
      if (Math.max(1, Math.round(s.pixelSize * view.ratio)) !== view.cell) allocate();
      let trailCount = 0;
      for (let i = 0; i < trailPoints.length && trailCount < DT_TRAIL; i++) {
        const p = trailPoints[i];
        if (p.weight <= 0.01) continue;
        trailData.set([p.x, p.y, p.weight], trailCount * 3); trailCount++;
      }
      let rippleCount = 0;
      for (let i = ripples.length - 1; i >= 0 && rippleCount < DT_RIPPLES; i--) {
        rippleData.set([ripples[i].x, ripples[i].y, ripples[i].age, 1], rippleCount * 4); rippleCount++;
      }
      const eased = s.intro && !reduce ? state.reveal * state.reveal * (3 - 2 * state.reveal) : 1;

      gl.bindVertexArray(vao);
      gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
      gl.viewport(0, 0, view.cols, view.rows);
      gl.useProgram(wave.program);
      const w = wave.uniforms;
      gl.uniform2f(w.uResolution, canvas.width / view.ratio, canvas.height / view.ratio);
      gl.uniform1f(w.uCell, view.cellCss);
      gl.uniform1f(w.uTime, state.time);
      gl.uniform1f(w.uWaveSpeed, s.waveSpeed);
      gl.uniform1f(w.uWaveFrequency, s.waveFrequency);
      gl.uniform1f(w.uWaveAmplitude, s.waveAmplitude);
      gl.uniform1f(w.uScale, s.scale);
      gl.uniform1f(w.uContrast, s.contrast);
      gl.uniform1f(w.uBrightness, s.brightness);
      gl.uniform1i(w.uEffect, s.effect);
      gl.uniform1f(w.uRadius, s.mouseRadius);
      gl.uniform1f(w.uStrength, s.mouseStrength);
      gl.uniform3fv(w.uTrail, trailData);
      gl.uniform1i(w.uTrailCount, trailCount);
      gl.uniform4fv(w.uRipples, rippleData);
      gl.uniform1i(w.uRippleCount, rippleCount);
      gl.uniform1f(w.uIntro, eased);
      gl.uniform1f(w.uReach, 0.5 * Math.hypot(view.width / view.height, 1) + 0.45);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.useProgram(dither.program);
      const d = dither.uniforms;
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, field);
      gl.uniform1i(d.uField, 0);
      gl.uniform2i(d.uFieldSize, view.cols, view.rows);
      gl.uniform1f(d.uCellDevice, view.cell);
      gl.uniform1i(d.uMode, s.mode);
      gl.uniform1f(d.uColorNum, s.colorNum);
      gl.uniform3fv(d.uWave, toColor(s.waveColor));
      const transparent = s.backgroundColor === 'transparent';
      gl.uniform3fv(d.uBackground, transparent ? [0, 0, 0] : toColor(s.backgroundColor));
      gl.uniform1f(d.uTransparent, transparent ? 1 : 0);
      s.palette.forEach((v, i) => paletteData.set(toColor(v), i * 3));
      gl.uniform3fv(d.uPalette, paletteData);
      gl.uniform1i(d.uPaletteCount, s.palette.length);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };

    const frame = now => {
      raf = 0;
      if (!visible || document.hidden) return;
      const s = settingsRef.current;
      const dt = last ? dClamp((now - last) / 1000, 0.0005, 0.05) : 1 / 60;
      last = now;
      if (!s.disableAnimation && !reduce) state.time += dt;
      const engaged = s.enableMouseInteraction && pointer.inside && !reduce;
      state.presence += ((engaged ? 1 : 0) - state.presence) * (1 - Math.exp(-dt / (engaged ? 0.12 : 0.35)));
      if (pointer.set) {
        const [tx, ty] = toUv(pointer.x, pointer.y);
        const follow = 1 - Math.exp(-dt / 0.06);
        const moved = Math.hypot(tx - state.hx, ty - state.hy);
        state.hx += (tx - state.hx) * follow; state.hy += (ty - state.hy) * follow;
        const decay = Math.exp(-dt / (0.08 + s.trail * 0.7));
        trailPoints.forEach(p => { p.weight *= decay; });
        const head = trailPoints[0];
        if (!head || Math.hypot(head.x - state.hx, head.y - state.hy) > 0.012 || moved > 0.012) {
          trailPoints.unshift({ x: state.hx, y: state.hy, weight: state.presence });
        } else { head.x = state.hx; head.y = state.hy; head.weight = state.presence; }
        if (s.trail <= 0.001) trailPoints.length = Math.min(trailPoints.length, 1);
        while (trailPoints.length > DT_TRAIL || (trailPoints.length > 1 && trailPoints[trailPoints.length - 1].weight < 0.01)) trailPoints.pop();
      }
      for (let i = ripples.length - 1; i >= 0; i--) {
        ripples[i].age += dt;
        if (ripples[i].age >= DT_RIPPLE_S) ripples.splice(i, 1);
      }
      if (!s.intro || reduce) state.reveal = 1;
      else if (state.reveal < 1) state.reveal = Math.min(1, state.reveal + dt / DT_INTRO);
      render();
      const busy = !s.disableAnimation || state.reveal < 1 || ripples.length > 0 || state.presence > 0.002 || trailPoints.some(p => p.weight > 0.01);
      if (busy && !reduce) raf = requestAnimationFrame(frame); else last = 0;
    };
    const wake = () => { if (!raf && visible && !document.hidden) raf = requestAnimationFrame(frame); };
    const resize = () => {
      const s = settingsRef.current;
      const width = Math.max(1, container.clientWidth), height = Math.max(1, container.clientHeight);
      const ratio = Math.min(s.dpr || window.devicePixelRatio || 1, 2);
      view.width = width; view.height = height;
      canvas.width = Math.max(1, Math.round(width * ratio));
      canvas.height = Math.max(1, Math.round(height * ratio));
      view.ratio = canvas.width / width;
      allocate(); render(); wake();
    };
    const locate = e => {
      const rect = container.getBoundingClientRect();
      pointer.x = e.clientX - rect.left; pointer.y = e.clientY - rect.top;
      pointer.inside = pointer.x >= 0 && pointer.y >= 0 && pointer.x <= rect.width && pointer.y <= rect.height;
      if (pointer.inside && !pointer.set) { const [x, y] = toUv(pointer.x, pointer.y); state.hx = x; state.hy = y; pointer.set = true; }
    };
    const onPointerMove = e => { locate(e); wake(); };
    const onPointerDown = e => {
      locate(e);
      if (!pointer.inside || !settingsRef.current.clickRipple || reduce) return;
      const [x, y] = toUv(pointer.x, pointer.y);
      ripples.push({ x, y, age: 0 });
      if (ripples.length > DT_RIPPLES) ripples.shift();
      wake();
    };
    const onPointerUp = e => { if (e.pointerType !== 'mouse') pointer.inside = false; };
    const onPointerLeave = () => { pointer.inside = false; };
    const onVisibility = () => { last = 0; wake(); };

    const resizeObserver = new ResizeObserver(resize);
    resizeObserver.observe(container);
    const intersection = new IntersectionObserver(entries => {
      visible = entries.some(en => en.isIntersecting);
      if (visible) { last = 0; wake(); }
    });
    intersection.observe(container);
    window.addEventListener('pointermove', onPointerMove, { passive: true });
    window.addEventListener('pointerdown', onPointerDown, { passive: true });
    window.addEventListener('pointerup', onPointerUp, { passive: true });
    window.addEventListener('pointercancel', onPointerUp, { passive: true });
    document.documentElement.addEventListener('pointerleave', onPointerLeave);
    document.addEventListener('visibilitychange', onVisibility);
    resize();

    let lastDpr = settingsRef.current.dpr;
    wakeRef.current = () => {
      if (settingsRef.current.dpr !== lastDpr) { lastDpr = settingsRef.current.dpr; resize(); return; }
      if (!raf) render();
      wake();
    };
    return () => {
      cancelAnimationFrame(raf);
      wakeRef.current = null;
      resizeObserver.disconnect(); intersection.disconnect();
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerdown', onPointerDown);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('pointercancel', onPointerUp);
      document.documentElement.removeEventListener('pointerleave', onPointerLeave);
      document.removeEventListener('visibilitychange', onVisibility);
      gl.deleteProgram(wave.program); gl.deleteProgram(dither.program);
      gl.deleteBuffer(buffer); gl.deleteVertexArray(vao);
      gl.deleteTexture(field); gl.deleteFramebuffer(framebuffer);
    };
  }, []);

  useEffect(() => { wakeRef.current && wakeRef.current(); });

  return (
    <div ref={containerRef} className={`dither-container${className ? ` ${className}` : ''}`} style={style}>
      <canvas ref={canvasRef} className="dither-canvas" aria-hidden="true" />
    </div>
  );
};
